<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.8"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        if (localStorage.getItem('dark-mode') === 'false') {
            document.querySelector('html').classList.remove('dark');
            document.querySelector('html').style.colorScheme = 'light';
        } else {
            document.querySelector('html').classList.add('dark');
            document.querySelector('html').style.colorScheme = 'dark';
        }
    </script>
</head>
<body class="font-inter antialiased bg-slate-100 dark:bg-gray-900 text-slate-600 dark:text-gray-100 tracking-tight">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            <!-- Header -->
            <header class="sticky top-0 bg-white dark:bg-gray-800 border-b border-slate-200 dark:border-gray-700 z-30">
                <div class="px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-16 -mb-px">
                        <!-- Header: Left side -->
                        <div class="flex">
                            <h1 class="text-2xl md:text-3xl text-slate-800 dark:text-white font-bold">Todo Management</h1>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main content -->
            <main class="flex-1">
                <div class="px-4 sm:px-6 lg:px-8 py-8 max-w-9xl mx-auto">
                    {{template "content" .}}
                </div>
            </main>
        </div>
    </div>
</body>
</html>
